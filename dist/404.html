<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | FansFollow</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1f2937 0%, #111827 50%, #1f2937 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 600px;
    }
    h1 {
      font-size: 8rem;
      background: linear-gradient(135deg, #f97316 0%, #9333ea 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      animation: pulse 2s ease-in-out infinite;
    }
    h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #fff;
    }
    p {
      font-size: 1.125rem;
      color: #d1d5db;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .button {
      display: inline-block;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #f97316 0%, #9333ea 100%);
      color: #fff;
      text-decoration: none;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 1.125rem;
      transition: transform 0.3s, box-shadow 0.3s;
      min-height: 56px;
      line-height: 56px;
      padding: 0 2rem;
    }
    .button:hover {
      transform: scale(1.05);
      box-shadow: 0 20px 25px -5px rgba(249, 115, 22, 0.3);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    @media (max-width: 640px) {
      h1 { font-size: 5rem; }
      h2 { font-size: 1.5rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track!</p>
    <a href="/" class="button">Return to Homepage</a>
  </div>
  <script>
    setTimeout(() => {
      if (window.location.pathname !== '/') {
        window.location.href = '/?redirect=' + encodeURIComponent(window.location.pathname);
      }
    }, 5000);
  </script>
</body>
</html>
